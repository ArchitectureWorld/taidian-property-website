name: Materialize HD community image

on:
  push:
    branches:
      - agent/hd-community-images
    paths:
      - '.github/workflows/materialize-hd-image.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/hd-community-images
          fetch-depth: 0

      - name: Decode and verify AVIF
        shell: bash
        run: |
          set -euo pipefail
          cat assets/.community-scenes.avif.b64.* | base64 --decode > assets/community-scenes.avif
          test "$(wc -c < assets/community-scenes.avif)" -eq 51334
          echo "419d29e702f4076499d85f1b136c56a2bb2d9995322534991026ac76907aed0b  assets/community-scenes.avif" | sha256sum --check -
          python - <<'PY'
          from pathlib import Path
          data = Path("assets/community-scenes.avif").read_bytes()
          assert data[4:12] == b"ftypavif"
          PY

      - name: Run acceptance checks
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          node --check script.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          parser = HTMLParser()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          print("HTML parser: PASS")
          PY

      - name: Commit binary asset and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          rm assets/.community-scenes.avif.b64.*
          rm .github/workflows/materialize-hd-image.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets .github/workflows
          git commit -m 'feat: materialize HD community imagery'
          git push origin HEAD:agent/hd-community-images
