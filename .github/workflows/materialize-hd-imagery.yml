name: Materialize HD community imagery

on:
  push:
    branches:
      - design/hd-community-imagery
    paths:
      - '.image-staging/**'
      - '.github/workflows/materialize-hd-imagery.yml'

permissions:
  contents: write

concurrency:
  group: materialize-hd-community-imagery
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether every Base64 chunk is present
        id: ready
        shell: bash
        run: |
          required=(
            .image-staging/community.part-00
            .image-staging/community.part-01
            .image-staging/community.part-02
            .image-staging/community.part-03
            .image-staging/community.part-04
          )
          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Waiting for $file"
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Decode and verify image asset
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          cat .image-staging/community.part-* | base64 --decode > assets/community.webp
          echo 'bc8af86d93a8c61ba54bccea844a41d20a7e63b7faa0a74421d3556ac454d12b  assets/community.webp' | sha256sum --check --strict

      - name: Run repository verification
        if: steps.ready.outputs.ready == 'true'
        run: |
          python -m unittest discover -s tests -v
          node --check script.js

      - name: Record completion and remove staging files
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/superpowers/plans/2026-07-27-hd-community-imagery.md')
          source = path.read_text(encoding='utf-8')
          source = source.replace('- [ ] Materialize the binary asset on the Git branch.', '- [x] Materialize the binary asset on the Git branch.')
          source = source.replace('- [ ] Run the complete repository test suite and `node --check script.js` in GitHub Actions.', '- [x] Run the complete repository test suite and `node --check script.js` in GitHub Actions.')
          path.write_text(source, encoding='utf-8')
          PY
          rm -rf .image-staging
          rm -f .github/workflows/materialize-hd-imagery.yml

      - name: Commit verified asset
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: replace community image with HD asset'
          git push
